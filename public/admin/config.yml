backend:
  name: github
  repo: TheDeyeCode46/maskantalk
  branch: main
  base_url: https://sveltia-cms-auth.a-dowlatabadi-peptalk.workers.dev

media_folder: public/uploads
public_folder: /uploads

locale: fa

collections:
  - name: articles
    label: محتوا
    label_singular: آیتم
    folder: src/content/articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: title, label: عنوان, widget: string }
      - { name: description, label: توضیح کوتاه, widget: text }
      - { name: publishDate, label: تاریخ انتشار, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: cover, label: تصویر شاخص / تامبنیل, widget: image, required: false }
      - name: category
        label: دسته‌بندی
        widget: select
        options:
          - "خبر"
          - "تحلیل"
          - "یادداشت"
          - "داده"
          - "ویدیو"
          - "کوتاه"
        default: "خبر"
        hint: "ویدیو = قسمت کامل، کوتاه = ریلز/کلیپ کوتاه، بقیه = مقاله متنی"
      - { name: tags, label: برچسب‌ها, widget: list, required: false, default: [] }
      - name: aparatHash
        label: کد ویدیو آپارات
        widget: string
        required: false
        hint: "فقط کد ویدیو. مثلا از aparat.com/v/akd5lfq فقط بنویس akd5lfq"
      - name: instagramUrl
        label: لینک اینستاگرام (اختیاری)
        widget: string
        required: false
        hint: "لینک پست یا ریلز اینستاگرام"
      - { name: duration, label: مدت زمان, widget: string, required: false, hint: "مثلا 45:20" }
      - { name: author, label: نویسنده, widget: string, default: "تحریریه مسکن‌تاک" }
      - { name: featured, label: در هیرو نمایش داده شود؟, widget: boolean, default: false }
      - { name: body, label: متن, widget: markdown }