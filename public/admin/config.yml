backend:
  name: github
  repo: TheDeyeCode46/maskantalk
  branch: main
  base_url: https://sveltia-cms-auth.a-dowlatabadi-peptalk.workers.dev

media_folder: public/uploads
public_folder: /uploads

locale: fa

collections:
  - name: videos
    label: قسمت‌های مسکن‌تاک
    label_singular: قسمت
    folder: src/content/articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter:
      field: category
      value: ویدیو
    summary: "{{title}} — {{publishDate}}"
    fields:
      - { name: title, label: عنوان, widget: string }
      - { name: description, label: توضیح کوتاه, widget: text }
      - { name: publishDate, label: تاریخ انتشار, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: cover, label: تصویر شاخص (۱۹۲۰×۱۰۸۰), widget: image, required: false, hint: "برای برنامه: ۱۹۲۰×۱۰۸۰" }
      - { name: category, label: دسته‌بندی, widget: hidden, default: "ویدیو" }
      - { name: episode, label: شماره قسمت, widget: number, required: false, value_type: int }
      - { name: duration, label: مدت زمان (مثلا 45:20), widget: string, required: false, hint: "دقیقه:ثانیه یا ساعت:دقیقه:ثانیه" }
      - { name: aparatHash, label: کد ویدیو آپارات, widget: string, required: false, hint: "مثلا akd5lfq یا لینک کامل" }
      - { name: tags, label: برچسب‌ها, widget: list, required: false, default: [] }
      - { name: author, label: مجری / سازنده, widget: string, default: "تحریریه مسکن‌تاک" }
      - { name: featured, label: در هیرو نمایش داده شود؟, widget: boolean, default: false }
      - { name: body, label: متن, widget: markdown }

  - name: shorts
    label: برش‌های کوتاه
    label_singular: کلیپ کوتاه
    folder: src/content/articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter:
      field: category
      value: کوتاه
    summary: "{{title}} — {{publishDate}}"
    fields:
      - { name: title, label: عنوان, widget: string }
      - { name: description, label: توضیح کوتاه, widget: text, required: false, default: "" }
      - { name: publishDate, label: تاریخ انتشار, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: cover, label: تامبنیل (۱۰۸۰×۱۹۲۰), widget: image, required: false, hint: "برای ریلز عمودی: ۱۰۸۰×۱۹۲۰" }
      - { name: category, label: دسته‌بندی, widget: hidden, default: "کوتاه" }
      - name: aparatHash
        label: کد ویدیو آپارات
        widget: string
        required: false
        hint: "برای شورتز آپارات، لینک کامل را پیست کنید مثل https://www.aparat.com/shorts/2107794031550242816"
      - { name: instagramUrl, label: لینک اینستاگرام (اختیاری), widget: string, required: false }
      - { name: duration, label: مدت زمان (مثلا 0:45), widget: string, required: false }
      - { name: tags, label: برچسب‌ها, widget: list, required: false, default: [] }
      - { name: author, label: سازنده, widget: string, default: "تحریریه مسکن‌تاک" }
      - { name: featured, label: در هیرو نمایش داده شود؟, widget: boolean, default: false }
      - { name: body, label: متن (اختیاری), widget: markdown, required: false }

  - name: news
    label: اخبار و مقالات
    label_singular: مطلب
    folder: src/content/articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter:
      field: category
      value: [خبر, تحلیل, یادداشت, داده]
    summary: "{{category}} — {{title}}"
    fields:
      - { name: title, label: عنوان, widget: string }
      - { name: description, label: توضیح کوتاه, widget: text }
      - { name: publishDate, label: تاریخ انتشار, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: cover, label: تصویر اصلی (۱۶۰۰×۹۰۰), widget: image, required: false }
      - name: category
        label: دسته‌بندی
        widget: select
        options: ["خبر", "تحلیل", "یادداشت", "داده"]
        default: "خبر"
      - { name: tags, label: برچسب‌ها, widget: list, required: false, default: [] }
      - { name: author, label: نویسنده, widget: string, default: "تحریریه مسکن‌تاک" }
      - { name: featured, label: در هیرو نمایش داده شود؟, widget: boolean, default: false }
      - { name: body, label: متن, widget: markdown }
