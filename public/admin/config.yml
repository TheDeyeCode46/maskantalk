backend:
  name: github
  repo: TheDeyeCode46/maskantalk
  branch: main
  base_url: https://sveltia-cms-auth.a-dowlatabadi-peptalk.workers.dev

media_folder: public/uploads
public_folder: /uploads

locale: fa

collections:
  - name: articles
    label: محتوا
    label_singular: آیتم
    folder: src/content/articles
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{category}} · {{title}}"
    sortable_fields: ['publishDate', 'title', 'category']
    fields:
      - { name: title, label: عنوان, widget: string }
      - { name: description, label: توضیح کوتاه, widget: text, required: false, default: "" }
      - { name: publishDate, label: تاریخ انتشار, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: cover, label: تصویر شاخص / تامبنیل, widget: image, required: false, hint: "برنامه: ۱۹۲۰×۱۰۸۰ — ریلز: ۱۰۸۰×۱۹۲۰ — مقاله: ۱۶۰۰×۹۰۰" }
      - name: category
        label: نوع محتوا
        widget: select
        options:
          - { label: "🎬 قسمت برنامه (ویدیو)", value: "ویدیو" }
          - { label: "⚡ ویدیو کوتاه (ریلز)", value: "کوتاه" }
          - { label: "📰 خبر", value: "خبر" }
          - { label: "🔍 تحلیل", value: "تحلیل" }
          - { label: "✍️ یادداشت", value: "یادداشت" }
          - { label: "📊 داده", value: "داده" }
        default: "خبر"

      - name: videoFile
        label: آپلود ویدیو (فقط برای فایل‌های زیر ۲۵ مگابایت)
        widget: file
        required: false
        hint: "برای ریلزهای کوتاه. فایل مستقیم در سایت میزبانی می‌شود."

      - name: videoUrl
        label: لینک ویدیو (R2 یا سرور دیگر)
        widget: string
        required: false
        hint: "برای فایل‌های بزرگ. مثلا https://pub-xxxxx.r2.dev/my-reel.mp4"

      - name: aparatHash
        label: کد یا لینک آپارات (اختیاری)
        widget: string
        required: false
        hint: "کد ویدیو مثل akd5lfq — یا لینک کامل"

      - { name: instagramUrl, label: لینک اینستاگرام, widget: string, required: false }
      - { name: duration, label: مدت زمان (مثلا 0:45 یا 45:20), widget: string, required: false }
      - { name: episode, label: شماره قسمت, widget: number, required: false, value_type: int }
      - { name: tags, label: برچسب‌ها, widget: list, required: false, default: [] }
      - { name: author, label: نویسنده, widget: string, default: "تحریریه مسکن‌تاک" }
      - { name: featured, label: در هیرو نمایش داده شود؟, widget: boolean, default: false }
      - { name: body, label: متن, widget: markdown, required: false }
